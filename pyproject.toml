[project]
name = "xplor-mcp"
version = "0.1.0"
description = "Unofficial Python client for the Xplor Active gym/club API"
readme = "README.md"
authors = [
    { name = "Jérémy Olivier", email = "jeremy.olivier30@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastmcp>=4.1.0",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
]

[project.scripts]
xplor-mcp = "xplor_mcp:main"
xplor-login = "xplor_mcp.login:main"
xplor-mcp-server = "xplor_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
target-version = "py315"
line-length = 100
