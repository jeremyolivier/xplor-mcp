{% extends "base.html" %}
{% block content %}
  <h1>Connect your gym account</h1>
  <p class="subtitle">We'll send a one-time code to your email.</p>
  <form method="post" action="/xplor/login/start">
    <input type="hidden" name="txn" value="{{ txn }}">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" placeholder="you@example.com" required autofocus>
    <button type="submit">Send code</button>
  </form>
{% endblock %}
